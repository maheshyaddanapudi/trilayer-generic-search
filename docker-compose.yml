version: "3.9"

services:
  tgs-app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - POSTGRES_URL=postgresql://tgs:tgs_password@postgres:5432/tgs_db
    extra_hosts:
      # Lets the container reach Ollama (or any service) running on the
      # Docker host. Used when LLM_PROVIDER=ollama with
      # OLLAMA_BASE_URL=http://host.docker.internal:11434
      - "host.docker.internal:host-gateway"
    volumes:
      - whoosh_data:/app/data/whoosh
      - ./data:/app/data
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - tgs_network

  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "-O-", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tgs_network

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=tgs
      - POSTGRES_PASSWORD=tgs_password
      - POSTGRES_DB=tgs_db
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tgs -d tgs_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - tgs_network

volumes:
  neo4j_data:
  whoosh_data:
  pgvector_data:

networks:
  tgs_network:
